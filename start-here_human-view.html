<head>

  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8f4;
      --surface: #ffffff;
      --surface-soft: #f0f4ee;
      --ink: #16201d;
      --muted: #5d6862;
      --line: #d9dfd8;
      --accent: #0f766e;
      --accent-ink: #063f3b;
      --code: #edf2ef;
      --shadow: 0 12px 28px rgba(22, 32, 29, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 22px 24px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    h1, h2, h3 { margin: 0; line-height: 1.18; letter-spacing: 0; }
    h1 { font-size: 24px; }
    h2 { font-size: 18px; margin-top: 22px; }
    h3 { font-size: 15px; margin-top: 14px; }
    p { margin: 8px 0 0; color: var(--muted); }
    main { padding: 18px 24px 28px; display: grid; gap: 16px; }
    section { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
    .intro { padding: 18px; }
    .intro .line { margin-top: 7px; color: var(--muted); }
    .intro ul { margin: 8px 0 0 20px; padding: 0; color: var(--muted); }
    .intro li { margin: 4px 0; }
    .controls {
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(180px, 260px) auto;
      gap: 12px;
      align-items: end;
    }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
    }
    .count { color: var(--muted); white-space: nowrap; padding-bottom: 8px; }
    .table-wrap { overflow: auto; max-height: 68vh; border-radius: 8px; }
    table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
    th, td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 8px 10px;
      vertical-align: top;
      max-width: 360px;
      min-width: 145px;
      overflow-wrap: anywhere;
      background: var(--surface);
    }
    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--surface-soft);
      color: var(--accent-ink);
      text-align: left;
      font-size: 12px;
    }
    tr[tabindex] { cursor: pointer; }
    tr[tabindex]:hover td, tr.selected td { background: #f4faf7; }
    code {
      background: var(--code);
      border: 1px solid #d9e4df;
      border-radius: 4px;
      padding: 1px 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }
    .details { padding: 16px; }
    .details-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .path { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 12px; }
    .detail-field { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: #fbfcfb; min-height: 76px; }
    .detail-field strong { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .detail-field div { white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { color: var(--muted); padding: 18px; }
    @media (max-width: 780px) {
      header { position: static; padding: 18px; }
      main { padding: 12px; }
      .controls { grid-template-columns: 1fr; }
      .count { padding-bottom: 0; }
      th, td { min-width: 180px; }
    }
  </style>
</head>

e context.\n- Original files remain the evidence; Markdown bodies carry living data; protected metadata carries stable data, identifiers, and routing facts.\n- This file is the source of truth for the system-wide folder structure. Generated views and future integrity checks must be rebuilt from this file.\n- The main table is the filesystem contract: it says what each managed folder may contain, what must exist, and where the checker should stop or continue.\n- Agent boot starts from the provided welcome skill path; that welcome skill tells the agent which lenses and skills to scan.\n- The welcome skill, loaded lenses, loaded skills, and the table below are enough to work with the whole managed tree without scanning arbitrary folders for instructions.\n- An agent should help classify, summarize, verify, and maintain the structure without hiding the logic.\n- Triage intake for downloads, scans, photos, PDFs, archives, and external files before final filing.\n- Living `00xp_<folder-name>_readme.md` memory for managed folders that list a README, so context stays close to the files it governs.\n- Protected metadata for stable facts, identifiers, source links, ownership, routing, and template fields.\n- Composable skills and lenses that can be called from each system `00xp` file; skills may call other skills as pipelines.\n- Personal cooking assistant with shopping preparation and recipes display.\n- Personal news aggregator based on preferred links.\n\n## Four Main Files\n- `start-here.md` is the canonical source file for the table, rules, domain explanations, and integrity-check contract.\n- `start-here_human-view.html` is a generated, self-contained, read-only HTML human interface for reading `start-here.md`.\n- `start-here_template_template.md` is the base template for template files listed in the table.\n- `start-here_template_readme.md` is the base README template for folder readme files listed in the table.\n\n## Filesystem Memory Map\n- This table is the filesystem memory map: it defines every managed address, what each folder may contain, what must exist, and where the integrity check should continue or stop.\n- The table is a level matrix. One row is one complete allowed path from its first populated level to its deepest allowed level.\n- A level is a position in the folder path; a domain is the big subject area represented by the `Level 1 Folder`, so the table does not need a separate `Domain` column.\n- The table is intended for human planning, agent filing decisions, generated folder creation, and repeatable integrity checks against the local filesystem.\n- The agent must read the table header before using the table.\n- For scoped work, the agent should read only the rows relevant to the current `Level 1 Folder` domain and current path.\n- Each table row is independent and complete for the path it describes.\n- The agent must reread needed rows from `start-here.md` when exactness matters, especially after context compaction.\n- The agent should load the full table only for full-tree generation, full integrity checks, schema edits, or broad cross-domain changes.\n- Agents must treat the table as verbatim source data and must not change, normalize, rename, infer, or simplify table entries unless explicitly instructed by the user.\n- The integrity check offered by the table can report missing expected items, unexpected direct files or folders, naming mismatches, and illegal depth below closed folders.\n- `Level N Folder` selects the current path segment at that depth.\n- `Level N Expected Files` lists required direct files at that level.\n- `Level N Allowed Files` lists permitted direct files at that level that are not required.\n- `Level N Expected Templates` lists required direct template files at that level.\n- `Level N Expected Folders` lists required direct child folders at that level.\n- `Level N Allowed Folders` lists permitted direct child folders at that level that are not required.\n- The `Explanation` column explains intent and purpose without overriding the level cells.\n- Level 0 is the root row and defines what may exist directly in `./`.\n- Every row starts at Level 0 so the full path is visible from root to leaf.\n- The matrix currently runs through Level 7 so limited depth rules can close explicitly.\n- Level 7 closes the system: all Level 7 cells must be `<none>`; therefore any populated Level 6 row must have `Level 6 Expected Folders` and `Level 6 Allowed Folders` set to `<none>` so nothing can continue into Level 7.\n- Every expected, allowed, and folder-level field uses the same five-option grammar.\n- Option `<none>` means no direct item is named by that cell.\n- Option `<all>` means every direct item name is admitted by that cell.\n- Option exact name means one literal direct item name is admitted by that cell.\n- Option pattern means every direct item matching that pattern is admitted by that cell.\n- Option list means every direct item matching one of the listed exact names or patterns is admitted by that cell.\n- All literal names and patterns in the table are case-sensitive.\n- Canonical structural names are lowercase; uppercase variants are mismatches unless the table explicitly says otherwise.\n- Domain overview text lives in the Explanation column of the table so domain purpose remains attached to the exact structural rows.\n- Allowed-file and allowed-folder cells apply to direct children at that level; deeper space must be represented by the next populated level cells.\n- README files are local folder explanations: they describe how the folder is used, what local conventions apply, and what context matters there; they do not change allowed files, expected files, templates, folders, or depth rules from the table.\n\n| Level 0 Folder | Level 0 Expected Files | Level 0 Allowed Files | Level 0 Expected Templates | Level 0 Expected Folders | Level 0 Allowed Folders | Level 1 Folder | Level 1 Expected Files | Level 1 Allowed Files | Level 1 Expected Template
